
<!DOCTYPE html>

    <!-- Include typography plugin for 'prose' classes -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {

            }
          }
        }
      }
    </script>
    <!-- KaTeX CSS is essential for rendering math symbols correctly -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "three": "https://esm.sh/three@0.166.1",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1",
    "remark-math": "https://esm.sh/remark-math@6.0.0",
    "rehype-katex": "https://esm.sh/rehype-katex@7.0.0",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0",
    "rehype-raw": "https://esm.sh/rehype-raw@7.0.0"
  }
}
</script>
<style>
  /* Fix for KaTeX display math in Tailwind prose blocks */
  .katex-display {
    margin: 1.5em 0 !important;
    overflow-x: auto;
    overflow-y: hidden;
  }
  /* Remove default Tailwind quote characters to keep it minimalist */
  .prose :where(blockquote p:first-of-type):not(:where([class~="not-prose"] *))::before,
  .prose :where(blockquote p:last-of-type):not(:where([class~="not-prose"] *))::after {
    content: "" !important;
  }
</style>
